name: Push server keep-alive

on:
  schedule:
    # Every 5 minutes — wakes Render free tier and delivers due pushes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /tick
        run: |
          set -e
          URL="https://sailing-push.onrender.com"
          echo "Pinging $URL/tick ..."
          # Free Render may be cold — allow a long timeout / retry via /health
          if ! curl -fsS --max-time 90 "${URL}/tick"; then
            echo "tick failed, trying /health..."
            curl -fsS --max-time 120 "${URL}/health"
          fi
          echo
